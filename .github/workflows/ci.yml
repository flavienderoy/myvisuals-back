# ================================
# Visuals.co — Backend CI/CD
# Lint → Test → Docker → Deploy
# Backend: Google Cloud Run (europe-west1)
# (The frontend lives in the myvisuals-client repo with its own pipeline.)
# ================================

name: Backend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GCP_REGION: europe-west1
  # ⚠️ Doit correspondre au service réellement appelé par le front
  # (VITE_API_URL → https://myvisuals-back-*.europe-west1.run.app).
  # La chaîne déployait auparavant vers « visuals-api », un second service que
  # personne n'interrogeait : la CI était verte, le déploiement réussissait, et
  # la production continuait de servir du code vieux d'un mois (ANO-2026-004).
  CLOUD_RUN_SERVICE: myvisuals-back

jobs:
  # ─────────────────────────────────
  # Job 1: Lint
  # ─────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: ./server
        run: npm ci
      - name: Run ESLint
        working-directory: ./server
        run: npm run lint

  # ─────────────────────────────────
  # Job 1bis: Journal de version + audit des dépendances
  # Indépendant du lint : ces contrôles ne dépendent pas du code source et
  # doivent rendre leur verdict même si le lint échoue.
  # ─────────────────────────────────
  governance:
    name: 📓 Journal de version & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      # Empêche la dérive entre la version annoncée par l'API (/health lit
      # package.json) et celle publiée dans CHANGELOG.md. Cette divergence est
      # déjà survenue : /health a annoncé 1.0.0 pendant six publications.
      - name: Vérifier la cohérence du journal de version
        run: node scripts/check-changelog.cjs server

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      # Bloquant à partir de « high » : une vulnérabilité de ce niveau ne doit
      # pas atteindre la production sans décision explicite.
      - name: Audit de sécurité des dépendances
        working-directory: ./server
        run: npm audit --audit-level=high

      # Informatif : donne la visibilité sur la dette de mise à jour sans
      # bloquer la livraison pour un simple retard de version mineure.
      - name: Dépendances en retard (informatif)
        working-directory: ./server
        run: npm outdated || true

  # ─────────────────────────────────
  # Job 2: API tests + coverage
  # ─────────────────────────────────
  test:
    name: 🧪 Test API
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: ./server
        run: npm ci
      - name: Run API tests with coverage
        working-directory: ./server
        run: npm run test:coverage
        env:
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ─────────────────────────────────
  # Job 3: Docker build (verify image builds)
  # ─────────────────────────────────
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: ./server
        run: docker build -t visuals-api:ci .
      - name: Verify Docker image
        run: docker images visuals-api:ci
      # Smoke test: actually BOOT the container and hit /health.
      # `docker build` alone never runs the app, so a missing runtime file
      # (e.g. an un-COPYed source dir) would pass build but crash on Cloud Run.
      - name: Smoke test — boot container & check /health
        run: |
          docker run -d --name visuals-api-smoke -p 8080:8080 \
            -e NODE_ENV=production \
            -e SUPABASE_URL=https://placeholder.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=placeholder \
            visuals-api:ci
          echo "Waiting for the app to start…"
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "✅ /health responded — container boots correctly"
              docker rm -f visuals-api-smoke >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "❌ Container failed to serve /health within 30s — dumping logs:"
          docker logs visuals-api-smoke || true
          docker rm -f visuals-api-smoke >/dev/null
          exit 1

  # ─────────────────────────────────
  # Job 4: Deploy backend (Google Cloud Run)
  # ─────────────────────────────────
  deploy-backend:
    name: 🚀 Deploy to Cloud Run
    runs-on: ubuntu-latest
    # `governance` est bloquant pour le déploiement : publier une version dont
    # le journal ne rend pas compte casse la traçabilité recherchée.
    needs: [docker, governance]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # ── Garde-fou : ne jamais déployer avec une configuration incomplète ──
      # `--set-env-vars` est *déclaratif* : un secret absent est injecté en
      # chaîne vide et ÉCRASE la valeur en place. C'est exactement ce qui s'est
      # produit (ANO-2026-004) : SUPABASE_URL et SUPABASE_SERVICE_ROLE_KEY
      # n'existaient pas côté GitHub, le déploiement réussissait, et le service
      # démarrait sans accès à la base — tout en répondant « ok » sur /health.
      # Mieux vaut un déploiement qui échoue bruyamment qu'un service en ligne
      # incapable de servir la moindre requête métier.
      - name: Vérifier la présence des secrets de déploiement
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ]              || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$CLIENT_URL" ]                || missing="$missing CLIENT_URL"

          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing"
            echo "Définissez-les dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "✅ Les trois secrets requis sont présents."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Deploy to Cloud Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
        run: |
          # Étape 1 : purge des secrets Secret Manager éventuellement rattachés
          # au service, pour éviter un conflit de type avec --set-env-vars.
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" --clear-secrets || true

          # Étape 2 : déploiement. Les valeurs passent par l'environnement du
          # runner et non par interpolation directe dans la ligne de commande :
          # une clé contenant une virgule ou un caractère spécial casserait le
          # découpage de --set-env-vars.
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source ./server \
            --region "$GCP_REGION" \
            --allow-unauthenticated \
            --set-env-vars "^@^NODE_ENV=production@CLIENT_URL=${CLIENT_URL}@SUPABASE_URL=${SUPABASE_URL}@SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"

      # ── Vérification post-déploiement ────────────────────────────────────
      # Un déploiement « réussi » ne prouve que la mise en ligne du conteneur.
      # Seule la sonde d'aptitude atteste que le service peut réellement servir
      # une requête métier : elle interroge PostgreSQL et le stockage objet.
      - name: Vérifier la sonde d'aptitude en production
        run: |
          URL=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" --format='value(status.url)')
          echo "Service déployé : $URL"

          # Un HTTP 503 (statut « down ») fait échouer `curl -f` : le corps est
          # alors vide et la boucle réessaie, le temps que la révision prenne
          # le trafic. Après 10 tentatives, l'échec est définitif.
          for i in $(seq 1 10); do
            body=$(curl -fsS --max-time 20 "$URL/health/ready" 2>/dev/null || true)
            ready_status=$(echo "$body" | grep -o '"status":"[a-z]*"' | head -1 | cut -d'"' -f4)

            if [ "$ready_status" = "ok" ]; then
              echo "✅ /health/ready → ok — base et stockage joignables"
              echo "$body"
              exit 0
            fi

            echo "Tentative $i/10 — statut « ${ready_status:-injoignable} »"
            sleep 6
          done

          echo "::error::Le service est en ligne mais /health/ready ne répond pas « ok »."
          echo "Dernière réponse : $body"
          exit 1
